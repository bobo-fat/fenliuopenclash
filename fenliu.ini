; ==========================================================
; 5) 
; ==========================================================
; 
custom_proxy_group= `select`.*
custom_proxy_group= `url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group= HK`url-test`(?i)(||\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group= TW`url-test`(?i)(||\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group= JP`url-test`(?i)(||\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group= SG`url-test`(?i)(||\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group= US`url-test`(?i)(||\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50
;  HK/JP/TW/US/SGselector 
; 
custom_proxy_group= `select`(?i)^(?!.*(||\\bHK\\b|hong\\s*kong|||\\bJP\\b|tokyo|osaka|||\\bTW\\b|taiwan|taipei|hinet|||\\bSG\\b|singapore|||\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*
